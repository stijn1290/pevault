[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pevault"
version = "0.1.0"
description = "An open-source CLI password manager written in Python"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[project.scripts]
pevault = "pevault.cli:main"